name: compatibility
on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/browser
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run ci:stress
  report:
    if: always() && (needs.browser.result == 'failure' || needs.stress.result == 'failure') && github.ref == 'refs/heads/main'
    needs: [browser, stress]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = 'CI compatibility suite is failing';
            const body = `The scheduled/manual compatibility check failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nOwner: @elsehow. Triage on the next working day; preserve the regression and fix its cause. Failure diagnostics are attached to the run. Keep this issue open until a subsequent main run passes and the cause is understood.`;
            const issues = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', creator: 'github-actions[bot]' });
            const issue = issues.find(issue => issue.title === title);
            if (issue) await github.rest.issues.update({ ...context.repo, issue_number: issue.number, body });
            else await github.rest.issues.create({ ...context.repo, title, body, assignees: ['elsehow'] });

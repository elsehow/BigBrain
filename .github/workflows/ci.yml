# The merge checks: `ci:checks`, split into jobs that run side by side —
# the static checks, and the unit suite in two balanced parts.
# The browser suites (macOS and Linux) and repeated stress run nightly and
# by hand in compatibility.yml.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run ci:static
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # Tests import viewer modules, which resolve against web/ui's own deps.
      - run: bun install --frozen-lockfile --cwd web/ui
      # Desktops' files and commands run through the guest agent (packages/guest)
      - run: bun run guest:build
      - run: bun run test -- --part ${{ matrix.part }}/2
  # The guest agent (packages/guest) built for real, and the protocol's
  # conformance suite run against it. The unit suite skips that file
  # without a built guest; this job is where it can't be skipped.
  guest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --check --manifest-path packages/guest/Cargo.toml
      - run: cargo clippy --release --manifest-path packages/guest/Cargo.toml -- -D warnings
      - run: bun run guest:build
      - run: BIGBRAIN_GUEST_REQUIRED=1 bun test packages/agents/test/guest.test.ts

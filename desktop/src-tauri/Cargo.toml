[package]
name = "bigbrain-desktop"
version = "0.0.0" # unused — tauri.conf.json's `version` is the app version (tauri build and site/build.ts read it)
description = "BigBrain desktop — a Tauri shell around the engine (bun sidecar + bundled engine tree)"
authors = ["Nick Merrill"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "bigbrain_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = ["tray-icon", "macos-private-api"] }
log = "0.4"
tauri-plugin-log = "2"
# the folder picker on first run / settings › vault (lib/native.ts in the viewer)
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# bigbrain://connect?invite=… from a server's invite page opens Connect a server
# with the link filled in (lib.rs invite_from / open_invite). macOS sends the
# link to the running app itself, so no single-instance plugin.
tauri-plugin-deep-link = "2"
# reading `GET /api/engine` from an engine already on the ports (lib.rs)
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# kill(2) to a process group: one signal takes the supervisor and everything
# it started down together (#597)
libc = "0.2"
# updates: fetch the site's latest.json, verify the minisign signature against
# the pubkey in tauri.conf.json, swap the .app in place (lib.rs update_check /
# update_install; the viewer's banner drives both over invoke)
tauri-plugin-updater = "2"

<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="-18 -18 36 36" role="img" aria-label="BigBrain menu bar icon">
  <title>BigBrain menu bar icon (template)</title>
  <!-- A macOS *template* image: the system keeps only the alpha channel and
       paints it in the menu bar's own ink (black on light, white on dark,
       dimmed when inactive), so colour here is meaningless.
       The mark is the wire mark — bigbrain.cool's two-by-two cube, the one
       lib/sharedPages.ts draws — with its geometry scaled by 14/72.125, so
       the cube is 28px wide on a 36px canvas: exactly 18pt at 2x, the
       height tray-icon gives every menu bar image, so a retina screen draws
       it pixel for pixel. Every vertical edge lands on a pixel boundary
       (x = 4, 11, 18, 25, 32) under a 2px (1pt) stroke, which is what keeps
       nine lines this close apart crisp. desktop/icons.sh renders it. -->
  <g fill="none" stroke="#000" stroke-width="2">
    <path d="M0 -15.573 L14 -8.573 L14 8.573 L0 15.573 L-14 8.573 L-14 -8.573 Z"/>
    <path d="M-14 -8.573 L0 -1.573 L14 -8.573 M0 -1.573 L0 15.573 M-7 -12.073 L7 -5.073 M7 -12.073 L-7 -5.073 M14 0 L0 7 M7 -5.073 L7 12.073 M-7 -5.073 L-7 12.073 M-14 0 L0 7" stroke-linecap="round"/>
  </g>
</svg>

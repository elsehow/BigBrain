[package]
name = "bigbrain-guest"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "The agent inside a desktop's machine: PID 1, serving the guest protocol (packages/agents/PROTOCOL.md)."
publish = false

[[bin]]
name = "bigbrain-guest"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
